{% extends "base.html" %}
{% block title %}Create Blog{% endblock %}

{% block content %}

<div style="
    max-width:760px;
    margin:50px auto;
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(15,23,42,.08);
    overflow:hidden;
">

    <div style="
        padding:32px 36px;
        border-bottom:1px solid #eef2f7;
    ">
        <h1 style="
            margin:0;
            font-size:30px;
            color:#111827;
            font-weight:700;
        ">
            Create New Blog
        </h1>

        <p style="
            margin:10px 0 0;
            color:#6b7280;
            font-size:15px;
            line-height:1.6;
        ">
            Share your ideas, experiences, or stories with your readers.
        </p>
    </div>

    <form
        action="{{ url_for('submit') }}"
        method="POST"
        enctype="multipart/form-data"
        style="padding:36px;">

        <!-- Blog Title -->

        <div style="margin-bottom:26px;">

            <label
                for="title"
                style="
                    display:block;
                    margin-bottom:8px;
                    font-weight:600;
                    color:#374151;
                ">
                Blog Title
            </label>

            <input
                id="title"
                name="title"
                type="text"
                required

                placeholder="Enter your blog title"

                style="
                    width:100%;
                    padding:14px 16px;
                    font-size:15px;
                    border:1px solid #d1d5db;
                    border-radius:10px;
                    outline:none;
                    box-sizing:border-box;
                    background:#fff;
                ">
        </div>

        <!-- Blog Body -->

        <div style="margin-bottom:26px;">

            <label
                for="body"
                style="
                    display:block;
                    margin-bottom:8px;
                    font-weight:600;
                    color:#374151;
                ">
                Blog Content
            </label>

            <textarea
                id="body"
                name="body"
                required

                placeholder="Write your blog here..."

                style="
                    width:100%;
                    min-height:260px;
                    padding:16px;
                    font-size:15px;
                    line-height:1.8;
                    border:1px solid #d1d5db;
                    border-radius:10px;
                    resize:vertical;
                    outline:none;
                    box-sizing:border-box;
                    font-family:inherit;
                "></textarea>

        </div>

        <!-- Image Upload -->

        <div style="margin-bottom:34px;">

            <label
                for="file"
                style="
                    display:block;
                    margin-bottom:8px;
                    font-weight:600;
                    color:#374151;
                ">
                Cover Image
            </label>

            <input
                id="file"
                name="file"
                type="file"
                accept="image/*"

                style="
                    width:100%;
                    padding:12px;
                    border:1px dashed #cbd5e1;
                    border-radius:10px;
                    background:#f8fafc;
                    box-sizing:border-box;
                    cursor:pointer;
                ">

            <p style="
                margin:8px 0 0;
                font-size:13px;
                color:#9ca3af;
            ">
                PNG, JPG or JPEG. This image will appear as the blog cover.
            </p>

        </div>

        <!-- Buttons -->

        <div style="
            display:flex;
            justify-content:flex-end;
            gap:14px;
        ">

            <a
                href="{{ url_for('listblogs') }}"
                style="
                    text-decoration:none;
                    padding:13px 22px;
                    border:1px solid #d1d5db;
                    color:#374151;
                    border-radius:10px;
                    font-weight:600;
                ">
                Cancel
            </a>

            <button
                type="submit"

                style="
                    background:#2563eb;
                    color:white;
                    border:none;
                    padding:13px 26px;
                    border-radius:10px;
                    font-size:15px;
                    font-weight:600;
                    cursor:pointer;
                    box-shadow:0 8px 20px rgba(37,99,235,.25);
                ">

                Publish Blog

            </button>

        </div>

    </form>

</div>

{% endblock %}
