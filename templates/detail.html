{% extends "base.html" %}
{% block title %}{{ blog.title }}{% endblock %}

{% block content %}

<div style="
    max-width:850px;
    margin:50px auto;
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(15,23,42,.08);
">

    {% if blog.image_filename %}
    <img
        src="{{ url_for('static', filename='uploads/' + blog.image_filename) }}"
        alt="{{ blog.title }}"
        style="
            width:100%;
            max-height:450px;
            object-fit:cover;
            display:block;
        ">
    {% endif %}

    <div style="padding:40px;">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:20px;
            flex-wrap:wrap;
        ">

            <div>

                <h1 style="
                    margin:0;
                    font-size:36px;
                    line-height:1.3;
                    color:#111827;
                    font-weight:700;
                ">
                    {{ blog.title }}
                </h1>

                <p style="
                    margin:14px 0 0;
                    color:#6b7280;
                    font-size:15px;
                ">
                    Published on
                    <strong>{{ blog.created_date.strftime('%B %d, %Y') }}</strong>
                </p>

            </div>

        </div>

        <hr style="
            border:none;
            border-top:1px solid #edf2f7;
            margin:28px 0 34px;
        ">

        <div style="
            color:#374151;
            font-size:17px;
            line-height:1.9;
            word-break:break-word;
        ">

            {{ blog.body|replace('\n', '<br>')|safe }}

        </div>

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:15px;
            margin-top:45px;
            padding-top:28px;
            border-top:1px solid #edf2f7;
        ">

            <a
                href="{{ url_for('home') }}"
                style="
                    text-decoration:none;
                    color:#2563eb;
                    font-weight:600;
                ">
                ← Back to Home
            </a>

            <div style="display:flex;gap:12px;">

                <a
                    href="{{ url_for('edit_blog', id=blog.id) }}"
                    style="
                        text-decoration:none;
                        background:#2563eb;
                        color:white;
                        padding:12px 22px;
                        border-radius:10px;
                        font-weight:600;
                        box-shadow:0 8px 18px rgba(37,99,235,.22);
                    ">
                    Edit
                </a>

                <a
                    href="{{ url_for('delete_post', id=blog.id) }}"
                    onclick="return confirm('Are you sure you want to delete this blog?')"
                    style="
                        text-decoration:none;
                        background:#dc2626;
                        color:white;
                        padding:12px 22px;
                        border-radius:10px;
                        font-weight:600;
                        box-shadow:0 8px 18px rgba(220,38,38,.18);
                    ">
                    Delete
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
