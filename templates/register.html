{% extends "base.html" %}
{% block title %}Register - Flask Blog{% endblock %}

{% block content %}

<div style="
    max-width:500px;
    margin:70px auto;
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(15,23,42,.08);
">

    <div style="
        padding:36px;
        border-bottom:1px solid #eef2f7;
        text-align:center;
    ">

        <div style="
            width:72px;
            height:72px;
            margin:0 auto 20px;
            background:#eff6ff;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
        ">
            👤
        </div>

        <h1 style="
            margin:0;
            color:#111827;
            font-size:30px;
            font-weight:700;
        ">
            Create Account
        </h1>

        <p style="
            margin:12px 0 0;
            color:#6b7280;
            line-height:1.7;
        ">
            Join FlaskBlog and start sharing your stories with the community.
        </p>

    </div>

    <form method="POST" style="padding:36px;">

        <div style="margin-bottom:20px;">

            <label style="
                display:block;
                margin-bottom:8px;
                font-weight:600;
                color:#374151;
            ">
                Username
            </label>

            <input
                type="text"
                name="username"
                required
                placeholder="Choose a username"

                style="
                    width:100%;
                    padding:14px 16px;
                    border:1px solid #d1d5db;
                    border-radius:10px;
                    font-size:15px;
                    box-sizing:border-box;
                    outline:none;
                ">

        </div>

        <div style="margin-bottom:20px;">

            <label style="
                display:block;
                margin-bottom:8px;
                font-weight:600;
                color:#374151;
            ">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                required
                placeholder="Enter your email"

                style="
                    width:100%;
                    padding:14px 16px;
                    border:1px solid #d1d5db;
                    border-radius:10px;
                    font-size:15px;
                    box-sizing:border-box;
                    outline:none;
                ">

        </div>

        <div style="margin-bottom:28px;">

            <label style="
                display:block;
                margin-bottom:8px;
                font-weight:600;
                color:#374151;
            ">
                Password
            </label>

            <input
                type="password"
                name="password"
                required
                placeholder="Create a secure password"

                style="
                    width:100%;
                    padding:14px 16px;
                    border:1px solid #d1d5db;
                    border-radius:10px;
                    font-size:15px;
                    box-sizing:border-box;
                    outline:none;
                ">

        </div>

        <button
            type="submit"

            style="
                width:100%;
                background:#2563eb;
                color:white;
                border:none;
                padding:15px;
                border-radius:10px;
                font-size:15px;
                font-weight:600;
                cursor:pointer;
                box-shadow:0 8px 20px rgba(37,99,235,.22);
            ">

            Create Account

        </button>

    </form>

    <div style="
        padding:24px 36px;
        border-top:1px solid #eef2f7;
        text-align:center;
        color:#6b7280;
        font-size:15px;
    ">

        Already have an account?

        <a
            href="{{ url_for('login') }}"
            style="
                color:#2563eb;
                text-decoration:none;
                font-weight:600;
            ">
            Sign In
        </a>

    </div>

</div>

{% endblock %}
